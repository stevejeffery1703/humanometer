<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0f1a"/>
      <stop offset="1" stop-color="#07090f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#d4a843" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#d4a843" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- subtle grid -->
  <g stroke="#ece8de" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="473" x2="1200" y2="473"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- logo dial + wordmark -->
  <g transform="translate(80,76)">
    <path d="M 4 34 A 18 18 0 1 1 40 34" stroke="#d4a843" stroke-width="3" fill="none"/>
    <circle cx="22" cy="24" r="2.8" fill="#d4a843"/>
    <line x1="22" y1="24" x2="34" y2="16" stroke="#d4a843" stroke-width="2.6" stroke-linecap="round"/>
    <text x="58" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#ece8de" letter-spacing="1">Human<tspan fill="#d4a843">ometer</tspan></text>
  </g>

  <!-- eyebrow -->
  <text x="80" y="250" font-family="Arial, sans-serif" font-size="20" letter-spacing="6" fill="#d4a843">PROFESSIONAL HUMAN CAPABILITY ASSESSMENT</text>

  <!-- headline -->
  <text x="76" y="340" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="#ece8de">How <tspan font-style="italic" fill="#d4a843">human</tspan> are you,</text>
  <text x="76" y="420" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="#ece8de">professionally?</text>

  <!-- subline -->
  <text x="80" y="476" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="28" fill="#7a7670">The five professional skills AI can't replicate</text>

  <!-- trait pills -->
  <g font-family="Arial, sans-serif" font-size="19" fill="#ece8de" fill-opacity="0.82">
    <g>
      <rect x="80" y="520" width="200" height="44" rx="2" fill="#d4a843" fill-opacity="0.08" stroke="#d4a843" stroke-opacity="0.25"/>
      <text x="100" y="548">Adaptive Thinking</text>
    </g>
    <g>
      <rect x="296" y="520" width="206" height="44" rx="2" fill="#d4a843" fill-opacity="0.08" stroke="#d4a843" stroke-opacity="0.25"/>
      <text x="316" y="548">Ethical Judgement</text>
    </g>
    <g>
      <rect x="518" y="520" width="206" height="44" rx="2" fill="#d4a843" fill-opacity="0.08" stroke="#d4a843" stroke-opacity="0.25"/>
      <text x="538" y="548">Creative Synthesis</text>
    </g>
    <g>
      <rect x="740" y="520" width="200" height="44" rx="2" fill="#d4a843" fill-opacity="0.08" stroke="#d4a843" stroke-opacity="0.25"/>
      <text x="760" y="548">Empathic Accuracy</text>
    </g>
  </g>

  <!-- footer right -->
  <text x="1120" y="592" text-anchor="end" font-family="Arial, sans-serif" font-size="20" fill="#d4a843">Free · 5 minutes · humanometer.com</text>
</svg>
