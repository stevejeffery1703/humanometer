<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unsubscribe — Humanometer</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2307090f'/%3E%3Cpath d='M 4 25 A 12 12 0 1 1 28 25' stroke='%23d4a843' stroke-width='2' fill='none'/%3E%3Ccircle cx='16' cy='19' r='2.4' fill='%23d4a843'/%3E%3Cline x1='16' y1='19' x2='23' y2='13' stroke='%23d4a843' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090f;--bg2:#0c0f1a;--gold:#d4a843;--gold2:#f0c96a;--text:#ece8de;--muted:#7a7670;--gbdr:rgba(212,168,67,.22);--ok:#5bbf9a;--bad:#e05c5c;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;font-weight:300;line-height:1.65;min-height:100vh;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 48px;border-bottom:1px solid var(--gbdr);background:var(--bg2);}
@media(max-width:600px){.topbar{padding:14px 18px;}}
.topbar-logo{display:flex;align-items:center;gap:14px;}
.topbar-logo svg{width:30px;height:30px;flex-shrink:0;}
.wm{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;letter-spacing:.04em;line-height:1;}
.wm b{color:var(--gold);}
.back{color:var(--muted);text-decoration:none;font-size:12px;letter-spacing:.07em;text-transform:uppercase;transition:color .2s;}
.back:hover{color:var(--gold);}
main{max-width:520px;margin:0 auto;padding:80px 28px 100px;}
@media(max-width:600px){main{padding:60px 22px 80px;}}
h1{font-family:'Cormorant Garamond',serif;font-size:clamp(28px,5vw,36px);font-weight:700;letter-spacing:-.02em;margin-bottom:12px;line-height:1.1;}
.lede{color:var(--muted);font-size:15px;margin-bottom:32px;}
.form{display:flex;flex-direction:column;gap:12px;background:var(--bg2);border:1px solid var(--gbdr);padding:24px;}
label{font-size:11.5px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;}
input[type=email]{background:var(--bg);border:1px solid var(--gbdr);color:var(--text);padding:13px 15px;font-family:'Outfit',sans-serif;font-size:14px;outline:none;transition:border-color .2s;}
input[type=email]:focus{border-color:var(--gold);}
button{background:var(--gold);color:#07090f;border:none;padding:13px 22px;font-family:'Outfit',sans-serif;font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .2s;margin-top:6px;}
button:hover{background:var(--gold2);}
button:disabled{opacity:.5;cursor:not-allowed;}
.msg{margin-top:18px;padding:14px 16px;font-size:14px;display:none;}
.msg.ok{display:block;background:rgba(91,191,154,.1);border:1px solid var(--ok);color:var(--ok);}
.msg.err{display:block;background:rgba(224,92,92,.1);border:1px solid var(--bad);color:var(--bad);}
.note{font-size:12.5px;color:var(--muted);margin-top:16px;font-style:italic;}
.note a{color:var(--gold);}
</style>
</head>
<body>
<header class="topbar">
  <a href="/" style="text-decoration:none;color:inherit;">
    <div class="topbar-logo">
      <svg viewBox="0 0 22 22" fill="none" aria-hidden="true"><path d="M 3 19 A 9 9 0 1 1 19 19" stroke="#d4a843" stroke-width="1.5" fill="none"/><circle cx="11" cy="15" r="1.7" fill="#d4a843"/><line x1="11" y1="15" x2="16" y2="11" stroke="#d4a843" stroke-width="1.5" stroke-linecap="round"/></svg>
      <div class="wm">Human<b>ometer</b></div>
    </div>
  </a>
  <a class="back" href="/">← Home</a>
</header>

<main>
  <h1>Unsubscribe</h1>
  <p class="lede">Enter your email and we'll remove it from our list immediately. No login required, no extra clicks.</p>

  <form class="form" id="unsub-form" onsubmit="return doUnsubscribe(event)">
    <label for="email">Your email address</label>
    <input id="email" type="email" required autocomplete="email" placeholder="you@example.com">
    <button id="submit" type="submit">Unsubscribe</button>
  </form>

  <div class="msg" id="msg"></div>

  <p class="note">Want to delete other data too? Email <a href="mailto:hello@humanometer.com">hello@humanometer.com</a> with your request.</p>
</main>

<script>
async function doUnsubscribe(e){
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const btn = document.getElementById('submit');
  const msg = document.getElementById('msg');
  if(!email || !email.includes('@')){
    msg.className='msg err';msg.textContent='Please enter a valid email address.';
    return false;
  }
  btn.disabled = true; btn.textContent = 'Removing…';
  msg.className=''; msg.textContent='';
  try{
    const r = await fetch('/api/unsubscribe',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email})
    });
    const d = await r.json();
    if(r.ok && d.success){
      msg.className='msg ok';
      msg.textContent='Done. Your email has been removed from our list. You will no longer receive emails from Humanometer.';
      document.getElementById('unsub-form').style.display='none';
    } else {
      msg.className='msg err';
      msg.textContent = d.error || 'Something went wrong. Please email hello@humanometer.com.';
      btn.disabled = false; btn.textContent = 'Unsubscribe';
    }
  } catch(err){
    msg.className='msg err';
    msg.textContent='Connection error. Please try again, or email hello@humanometer.com.';
    btn.disabled = false; btn.textContent = 'Unsubscribe';
  }
  return false;
}
// Auto-fill from URL ?email=... so an unsubscribe link can pre-fill
const params = new URLSearchParams(window.location.search);
if(params.get('email')){
  document.getElementById('email').value = params.get('email');
}
</script>
</body>
</html>
